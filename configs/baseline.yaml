# The shared baseline. The only complete config; every ablation overrides a few keys.
model:
  preset: bevo            # bevo | llama: defaults for norm, positions, MLP activation
  n_layer: 8
  d_model: 512
  n_head: 16
  n_kv_head: 16           # 16 = MHA, 4 = GQA, 1 = MQA
  mlp_ratio: 4
  context_len: 512
tokenizer:
  vocab_size: 50000       # TinyStories-trained BPE; smaller sizes are truncations of it
data:
  dataset: tinystories
train:
  tokens: 504M            # 20 tokens/param for the 25.2M baseline (Chinchilla)
  #batch_tokens: 16384 - for 12 GB laptop GPU
  batch_tokens: 131072 # for data-center GPU (~3,850 steps), 8x batch_tokens for laptop GPU
  #lr: 6.0e-4 - for 12 GB laptop GPU
  lr: 1.2e-3 # scaled with the batch; 6.0e-4 at 16384, 2x lr for laptop GPU
  warmup_frac: 0.05
  min_lr_ratio: 0.1
  weight_decay: 0.1
  seed: 1337
quant:
  scheme: int8            # none | int8 | w4a8 | w4a4 | w4a8kv4
eval:
  metrics: [bpb, memory]
