name: precision
question: How low can precision go?
# Order matters: the PTQ rows reuse the baseline checkpoint; the QAT row fine-tunes from it.
# The trained baseline (4c89c1af04) used the 16K-batch laptop config, so expand this study
# against its saved config to land on the same run IDs:
#   bevotron sweep configs/ablations/precision.yaml --baseline runs/4c89c1af04/config.yaml --write
pairs:
  - {quant.scheme: w4a4kv4, quant.mode: ptq}
  - {quant.scheme: w4a4kv4, quant.mode: qat}
  - {quant.scheme: w4a8kv4, quant.mode: ptq}   # 8-bit activations, 4-bit weights and KV cache
  # Static scales: one fixed scale per Linear input and per KV head, as an integer-only chip
  # needs. PTQ calibrates them on training windows; QAT starts there and learns them.
  - {quant.scheme: w4a4kv4, quant.mode: ptq, quant.scales: static}
  - {quant.scheme: w4a4kv4, quant.mode: qat, quant.scales: static}
  - {quant.scheme: w4a8kv4, quant.mode: ptq, quant.scales: static}
  - {quant.scheme: w4a8kv4, quant.mode: qat, quant.scales: static}
