name: precision
question: How low can precision go?
# Order matters: the PTQ rows reuse the baseline checkpoint; the QAT row fine-tunes from it.
# The trained baseline (4c89c1af04) used the 16K-batch laptop config, so expand this study
# against its saved config to land on the same run IDs:
#   bevotron sweep configs/ablations/precision.yaml --baseline runs/4c89c1af04/config.yaml --write
pairs:
  - {quant.scheme: w4a4kv4, quant.mode: ptq}
  - {quant.scheme: w4a4kv4, quant.mode: qat}
  - {quant.scheme: w4a8kv4, quant.mode: ptq}   # 8-bit activations, 4-bit weights and KV cache
  # Static scales: one fixed scale per Linear input and per KV head, as an integer-only chip
  # needs. PTQ calibrates them on training windows; QAT starts there and learns them.
  - {quant.scheme: w4a4kv4, quant.mode: ptq, quant.scales: static}
  - {quant.scheme: w4a4kv4, quant.mode: qat, quant.scales: static}
  - {quant.scheme: w4a8kv4, quant.mode: ptq, quant.scales: static}
  - {quant.scheme: w4a8kv4, quant.mode: qat, quant.scales: static}
  # Sampled scales (quant.hybrid): each matrix's scale from part of itself, times a learned
  # headroom. first_row: row 0's max for the whole matrix. first_n: the first N values of
  # the matrix. row_first_n: each row's own first N. first_tile: the top-left N x N tile.
  # Starting margins are the best of a float sweep on the per-token QAT run (no retraining).
  - {quant.scheme: w4a4kv4, quant.mode: qat, quant.scales: first_row, quant.scale_margin: 1.0}
  - {quant.scheme: w4a4kv4, quant.mode: qat, quant.scales: first_n, quant.scale_n: 8, quant.scale_margin: 2.0}
  - {quant.scheme: w4a4kv4, quant.mode: qat, quant.scales: first_n, quant.scale_n: 16, quant.scale_margin: 2.0}
  - {quant.scheme: w4a4kv4, quant.mode: qat, quant.scales: first_n, quant.scale_n: 64, quant.scale_margin: 1.0}
  - {quant.scheme: w4a4kv4, quant.mode: qat, quant.scales: first_n, quant.scale_n: 128, quant.scale_margin: 1.0}
  - {quant.scheme: w4a4kv4, quant.mode: qat, quant.scales: row_first_n, quant.scale_n: 8, quant.scale_margin: 2.0}
  - {quant.scheme: w4a4kv4, quant.mode: qat, quant.scales: row_first_n, quant.scale_n: 16, quant.scale_margin: 2.0}
  - {quant.scheme: w4a4kv4, quant.mode: qat, quant.scales: row_first_n, quant.scale_n: 64, quant.scale_margin: 1.5}
  - {quant.scheme: w4a4kv4, quant.mode: qat, quant.scales: row_first_n, quant.scale_n: 128, quant.scale_margin: 1.25}
  - {quant.scheme: w4a4kv4, quant.mode: qat, quant.scales: first_tile, quant.scale_n: 8, quant.scale_margin: 2.0}
  - {quant.scheme: w4a4kv4, quant.mode: qat, quant.scales: first_tile, quant.scale_n: 16, quant.scale_margin: 1.5}
